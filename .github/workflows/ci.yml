name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Every Node line that `engines` in package.json promises to support.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      # Reads the version from the `packageManager` field in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm build
      # The tests import src/. This imports what npm users get: the package, through its `exports`.
      - run: node --input-type=module -e "const sdk = await import('mercos-sdk'); if (typeof sdk.createMercos !== 'function') process.exit(1)"
