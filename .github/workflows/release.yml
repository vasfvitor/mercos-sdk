name: Release

# Publishing a GitHub release stages the same version on npm. A maintainer then approves it on
# npmjs.com, with 2FA, and only then can anyone install it. No npm token is stored: npm trusts this
# workflow through OIDC ("trusted publishing"), and the package gets a provenance statement that
# links it to this commit.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The release tag must match the version in package.json
        run: test "v$(node -p "require('./package.json').version")" = "${{ github.event.release.tag_name }}"
      # `npm stage` needs npm 11.15 or later, which is newer than the npm that ships with Node 24.
      - run: npm install -g npm@^11.15.0
      # Explicit, because the npm documentation doesn't say whether staging runs `prepublishOnly`.
      - run: pnpm verify && pnpm build
      - run: npm stage publish
