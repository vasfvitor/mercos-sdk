# Usa os estilos e o vocabulário globais do Vale (diretório XDG). Só muda o que o português exige.
MinAlertLevel = warning
Vocab = base

[*.md]
BasedOnStyles = Vale, Google

# README.md e CHANGELOG.md são em português. O dicionário e o estilo Google são só de inglês
# e marcariam o texto inteiro, então ficam desligados aqui. README.en.md segue as regras todas.
[{README,CHANGELOG}.md]
BasedOnStyles =
