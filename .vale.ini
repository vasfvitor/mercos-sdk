# Uses the global Vale styles and vocabulary (XDG directory). Only changes what Portuguese requires.
MinAlertLevel = warning
Vocab = base

[*.md]
BasedOnStyles = Vale, Google

# README.md is the Portuguese version. The dictionary and the Google style are English-only and
# would flag the whole text, so they are off for that one file. Everything else gets every rule.
[README.md]
BasedOnStyles =
